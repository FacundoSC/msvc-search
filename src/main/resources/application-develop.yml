spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      enable-auto-commit: true
    listener:
      auto-startup: false
    properties:
      spring.json.trusted.packages: "org.faccordoba.springcloud.msvc.msvcsearchriu.domain.model"

  data:
    redis:
      host: localhost
      port: 6379


